name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: damgio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: damgio_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U damgio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=damgio_ci;Username=damgio;Password=ci-only-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Apply migrations to a clean database
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --project src/Damgio.Infrastructure --startup-project src/Damgio.Web -c Release --no-build

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
