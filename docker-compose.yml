services:
  postgres:
    image: postgres:17
    container_name: damgio-postgres
    environment:
      POSTGRES_USER: damgio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      POSTGRES_DB: damgio
    ports:
      - "5432:5432"
    volumes:
      - damgio-pgdata:/var/lib/postgresql/data

volumes:
  damgio-pgdata:
